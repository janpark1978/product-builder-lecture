        </div>
        <div class="lotto-body">
            <div id="lotto-numbers" class="lotto-numbers"></div>
            <button id="generate-btn" class="lotto-button">Generate Numbers</button>
        </div>
        
        <hr class="divider">
        
        <div class="contact-section">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/mvzwvawl" method="POST" class="contact-form">
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="How can we collaborate?" required></textarea>
                <button type="submit" class="lotto-button">Send Message</button>
            </form>
        </div>

        <hr class="divider">
