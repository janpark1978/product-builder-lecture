<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Animal Face Test & Lotto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lotto-container">
        <div class="theme-toggle-container">
            <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        </div>
        <div class="lotto-header">
            <h1>AI Animal Face Test</h1>
            <p>Are you a Dog or a Cat face?</p>
        </div>

        <!-- Animal Face Test Section -->
        <div class="ai-section">
            <div id="webcam-container" class="webcam-wrapper"></div>
            <div id="label-container" class="prediction-wrapper"></div>
            <button type="button" class="lotto-button" id="start-ai-btn" onclick="initAI()">Start AI Test</button>
        </div>

        <hr class="divider">

        <div class="lotto-header">
            <h1>Lotto Generator</h1>
        </div>
        <div class="lotto-body">
            <div id="lotto-numbers" class="lotto-numbers"></div>
            <button id="generate-btn" class="lotto-button">Generate Numbers</button>
        </div>
        
        <hr class="divider">
        
        <div class="contact-section">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/mvzwvawl" method="POST" class="contact-form">
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="How can we collaborate?" required></textarea>
                <button type="submit" class="lotto-button">Send Message</button>
            </form>
        </div>

        <hr class="divider">

        <div id="disqus_thread"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
    
    <!-- Disqus Config -->
    <script>
        (function() {
            var d = document, s = d.createElement('script');
            s.src = 'https://productbuilder-qffyvs1r7z.disqus.com/embed.js';
            s.setAttribute('data-timestamp', +new Date());
            (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</body>
</html>
